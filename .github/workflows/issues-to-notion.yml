name: Issues to Notion Taks

on:
  schedule:
    - cron: '*/1 * * * *' # Execute each minute

jobs:
  run_job:
    runs-on: ubuntu-latest

    env:
      DOITFORME_URL: ${{ secrets.DOITFORME_URL }}

    steps:
    - name: Repository checkout
      uses: actions/checkout@v2

    - name: Execute Doitforme Endpoint
      run: |
        curl -X GET $DOITFORME_URL/tasks
